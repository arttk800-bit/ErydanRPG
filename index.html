<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#100c09"><link rel="manifest" href="./manifest.webmanifest"><title>Эйрдан RPG — PWA v2</title><link rel="stylesheet" href="./pwa-v2.css"></head>
<body>
<header><div><b>ЭЙРДАН</b><small>prototype v2</small></div><div id="clock"></div></header>
<main>
<section id="game" class="page active"><div class="sceneHead"><span id="place"></span><button id="advance">+15 мин</button></div><div id="story"></div><div id="choices"></div><div class="composer"><textarea id="action" placeholder="Что делает персонаж?"></textarea><button id="send">Действовать</button></div></section>
<section id="character" class="page"><div class="panel"><h2 id="heroName"></h2><p id="heroMeta"></p><div id="stats" class="grid"></div></div><div class="panel"><h3>Навыки</h3><div id="skills"></div></div></section>
<section id="status" class="page"><div class="panel"><h2>Состояние</h2><div id="conditions" class="grid"></div></div></section>
<section id="inventory" class="page"><div class="panel"><h2>Инвентарь</h2><div id="items"></div></div></section>
<section id="world" class="page"><div class="panel"><h2>Мир</h2><div id="places"></div></div></section>
<section id="settings" class="page"><div class="panel"><h2>Прототип</h2><p>Сейчас игра полностью локальная. OpenAI отключён: интерфейс и механики можно разрабатывать без API.</p><button id="reset">Сбросить демо-кампанию</button></div></section>
</main>
<nav id="nav"><button data-page="game" class="on">Игра</button><button data-page="character">Персонаж</button><button data-page="status">Состояние</button><button data-page="inventory">Инвентарь</button><button data-page="world">Мир</button><button data-page="settings">⚙</button></nav>
<script src="./pwa-v2.js"></script></body></html>
