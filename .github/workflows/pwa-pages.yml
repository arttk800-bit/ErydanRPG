# ACTIVE PWA DEPLOY
# Manual deploy after a completed, validated change block.
name: Deploy Eirdan PWA
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: game
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
