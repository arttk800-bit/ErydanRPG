name: PWA v2 Pages

on:
  push:
    branches: [pwa-v2]
    paths:
      - "index.html"
      - "pwa-v2.html"
      - "pwa-v2.css"
      - "pwa-v2.js"
      - "manifest.webmanifest"
      - "sw.js"
      - ".github/workflows/pwa-v2-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
