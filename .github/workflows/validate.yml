name: validate
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run validate
      - name: Modular Mirror x3000
        run: npm run mirror:3000
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mirror3000-modular
          path: artifacts/mirror3000-modular.json
