# CAMPAIGN GATE
# Manual release-block validation for the enabled campaign/client/world boundary.
name: validate campaign
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run validate:campaign
