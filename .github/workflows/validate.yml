# CAMPAIGN GATE
# Runs only when the finished change block is promoted to the ci/gate branch.
name: validate campaign
on:
  workflow_dispatch:
  push:
    branches:
      - ci/gate
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run validate:campaign
