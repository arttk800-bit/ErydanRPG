name: validate campaign
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'game/app/**'
      - 'game/client/**'
      - 'game/core/**'
      - 'game/map/**'
      - 'game/modules/**'
      - 'game/systems/**'
      - 'game/ui/**'
      - 'game/data/**'
      - 'game/diagnostics/**'
      - 'scripts/validate-domain.mjs'
      - 'scripts/validate-campaign.mjs'
      - 'tests/**'
      - 'package.json'
      - '.github/workflows/validate.yml'
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run validate:campaign
