# GODOT FOUNDATION GATE
# Isolated from the active PWA/campaign gate.
name: validate godot foundation
on:
  workflow_dispatch:
  push:
    branches:
      - ci/gate
    paths:
      - 'godot/**'
      - 'tests/godot-foundation-regression.mjs'
      - 'package.json'
      - '.github/workflows/godot-foundation.yml'
jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Static foundation contracts
        run: npm run test:godot-foundation
      - name: Install Godot 4.7.2 stable
        run: |
          curl -fL -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --version
      - name: Headless project boot
        run: |
          set -o pipefail
          LOG=/tmp/godot-boot.log
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --quit-after 2 2>&1 | tee "$LOG"
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script" "$LOG"; then exit 1; fi
      - name: Package installer integration
        run: |
          set -o pipefail
          LOG=/tmp/godot-package-test.log
          timeout 45s /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot -- --package-installer-test 2>&1 | tee "$LOG"
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script|ASSERT FAILED" "$LOG"; then exit 1; fi
          grep -F "godot package installer integration: OK" "$LOG"
      - name: Runtime updater integration
        run: |
          set -o pipefail
          LOG=/tmp/godot-updater-test.log
          timeout 45s /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot -- --updater-test 2>&1 | tee "$LOG"
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script|ASSERT FAILED" "$LOG"; then exit 1; fi
          grep -F "godot updater integration: OK" "$LOG"
