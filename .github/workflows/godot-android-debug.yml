# GODOT ANDROID DEBUG APK
# Builds an installable infrastructure APK without touching the PWA release path.
name: build godot android debug
on:
  workflow_dispatch:
    inputs:
      publish_update:
        description: 'Publish validated APK and updater manifest as a GitHub Release'
        type: boolean
        default: false
  push:
    branches:
      - ci/gate
    paths:
      - 'godot/**'
      - '.github/workflows/godot-android-debug.yml'
      - 'scripts/runtime-release.mjs'
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Godot 4.7.2 and matching export templates
        run: |
          set -euxo pipefail
          curl -fL -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          curl -fL -o /tmp/templates.tpz https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          unzip -q /tmp/templates.tpz -d /tmp/templates
          cp -a /tmp/templates/templates/. "$HOME/.local/share/godot/export_templates/4.7.2.stable/"
          printf '4.7.2.stable.official.ed1daf0bf\n' > "$HOME/.local/share/godot/export_templates/4.7.2.stable/version.txt"

      - name: Prepare persistent Android signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > /tmp/eirdan-development.jks
          keytool -list -keystore /tmp/eirdan-development.jks -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null

      - name: Validate runtime before export
        run: |
          set -euo pipefail
          npm run test:godot-foundation
          GODOT_BIN=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          "$GODOT_BIN" --headless --path godot --quit-after 2 2>&1 | tee /tmp/boot.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed to load script' /tmp/boot.log; then exit 1; fi
          for TEST in package-installer-test updater-test ui-stabilization-test; do
            timeout 45s "$GODOT_BIN" --headless --path godot -- --"$TEST" 2>&1 | tee /tmp/test.log
            if grep -E 'SCRIPT ERROR|Parse Error|Failed to load script|ASSERT FAILED' /tmp/test.log; then exit 1; fi
            grep -F 'integration: OK' /tmp/test.log
          done
          node scripts/runtime-release.mjs prepare

      - name: Export Android debug APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /tmp/eirdan-development.jks
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: ${{ secrets.ANDROID_KEY_ALIAS }}
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p build
          LOG=/tmp/godot-android-export.log
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --export-debug "Android Debug" ../build/eirdan-runtime-debug.apk 2>&1 | tee "$LOG"
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script|ERROR:.*export" "$LOG"; then exit 1; fi
          test -s build/eirdan-runtime-debug.apk
          sha256sum build/eirdan-runtime-debug.apk | tee build/eirdan-runtime-debug.apk.sha256
          keytool -printcert -jarfile build/eirdan-runtime-debug.apk | tee build/eirdan-runtime-debug.apk.cert.txt
          grep -F "SHA256: F3:2A:DE:FD:89:E7:1B:BB:DB:07:49:18:4A:53:11:F2:C8:E5:5E:AB:06:13:DB:35:AF:D3:93:4E:C4:60:5E:CB" build/eirdan-runtime-debug.apk.cert.txt
          AAPT_BIN=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)
          test -n "$AAPT_BIN"
          "$AAPT_BIN" dump badging build/eirdan-runtime-debug.apk > build/apk-badging.txt
          node scripts/runtime-release.mjs manifest

      - uses: actions/upload-artifact@v4
        with:
          name: eirdan-runtime-debug-apk
          path: |
            build/eirdan-runtime-debug.apk
            build/eirdan-runtime-debug.apk.sha256
            build/eirdan-runtime-debug.apk.cert.txt
            build/runtime-update.json
          if-no-files-found: error
          retention-days: 14

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_update
    needs: apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: eirdan-runtime-debug-apk
          path: build
      - name: Publish immutable runtime release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CODE=$(jq -r .version_code build/runtime-update.json)
          gh release create "runtime-$CODE" build/eirdan-runtime-debug.apk build/runtime-update.json build/eirdan-runtime-debug.apk.sha256 build/eirdan-runtime-debug.apk.cert.txt --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Eirdan Runtime $CODE" --notes 'Android runtime update. Content packages and saves are retained. Android asks for installation confirmation.' --latest
