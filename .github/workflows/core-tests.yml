name: Core regression
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['game/core/**','tests/**','package.json','.github/workflows/core-tests.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
