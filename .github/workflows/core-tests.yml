name: Combat regression
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'game/combat/**'
      - 'game/ai/**'
      - 'game/simulation/**'
      - 'game/systems/combat/**'
      - 'scripts/run-mirror3000.mjs'
      - 'scripts/validate-combat.mjs'
      - 'scripts/validate-domain.mjs'
      - 'tests/**'
      - 'package.json'
      - '.github/workflows/core-tests.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run validate:combat
