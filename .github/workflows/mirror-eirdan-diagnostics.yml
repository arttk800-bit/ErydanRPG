# LEGACY PWA DIAGNOSTIC MIRROR
# Historical/reference diagnostics only. Manual to avoid background legacy CI activity.
name: Legacy PWA mirror diagnostics
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Fetch latest legacy diagnostic
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          URL="https://eirdan-diagnostics.arttk800.workers.dev/latest?mirror=${GITHUB_RUN_ID}-$(date +%s)"
          curl --fail --silent --show-error --retry 3 "$URL" -H "Cache-Control: no-cache" -o diagnostics/latest.json
          jq -e '(.run_id|type=="string" and length>0) and (.log|type=="string" and length>10)' diagnostics/latest.json >/dev/null
          jq -r '.log' diagnostics/latest.json > diagnostics/latest.log
          jq '{run_id,build,generated_at,received_at,source,summary,log_characters:(.log|length)}' diagnostics/latest.json > diagnostics/latest-summary.json
      - name: Commit mirror
        shell: bash
        run: |
          set -euo pipefail
          git add diagnostics/latest.json diagnostics/latest.log diagnostics/latest-summary.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: mirror legacy Eirdan diagnostic [skip ci]"
            git push origin HEAD:main
          fi
