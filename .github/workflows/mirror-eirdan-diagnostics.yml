name: Mirror Eirdan diagnostics

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/mirror-eirdan-diagnostics.yml"
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: eirdan-diagnostics-mirror
  cancel-in-progress: true

jobs:
  mirror:
    name: Mirror latest KV diagnostic
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Fetch latest diagnostic from Cloudflare KV
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          curl --fail --silent --show-error --retry 3 \
            "https://eirdan-diagnostics.arttk800.workers.dev/latest" \
            -o diagnostics/latest.json

          test -s diagnostics/latest.json
          jq -e '
            (.run_id | type == "string" and length > 0) and
            (.log | type == "string" and length > 10)
          ' diagnostics/latest.json >/dev/null

      - name: Commit latest diagnostic if changed
        shell: bash
        run: |
          set -euo pipefail

          git add diagnostics/latest.json
          if git diff --cached --quiet; then
            echo "Diagnostic is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: mirror latest Eirdan diagnostic [skip ci]"
          git push origin HEAD:main
