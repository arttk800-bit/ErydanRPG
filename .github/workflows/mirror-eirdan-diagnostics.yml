name: Mirror Eirdan diagnostics

on:
  workflow_dispatch:
  repository_dispatch:
    types: [eirdan-diagnostic-ready]
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: eirdan-diagnostics-mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Fetch diagnostic
        shell: bash
        env:
          DISPATCH_RUN_ID: ${{ github.event.client_payload.run_id }}
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          if [ -n "${DISPATCH_RUN_ID:-}" ]; then
            ENC="$(printf '%s' "$DISPATCH_RUN_ID" | jq -sRr @uri)"
            URL="https://eirdan-diagnostics.arttk800.workers.dev/run?id=$ENC"
          else
            URL="https://eirdan-diagnostics.arttk800.workers.dev/latest"
          fi
          curl --fail --silent --show-error --retry 3 "$URL?mirror=${GITHUB_RUN_ID}-$(date +%s)" -H "Cache-Control: no-cache" -o diagnostics/latest.json
          jq -e '(.run_id|type=="string" and length>0) and (.log|type=="string" and length>10)' diagnostics/latest.json >/dev/null
          jq -r '.log' diagnostics/latest.json > diagnostics/latest.log
          jq '{run_id,build,generated_at,received_at,source,summary,log_characters:(.log|length)}' diagnostics/latest.json > diagnostics/latest-summary.json
      - name: Commit mirror
        shell: bash
        run: |
          set -euo pipefail
          git add diagnostics/latest.json diagnostics/latest.log diagnostics/latest-summary.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: mirror Eirdan diagnostic [skip ci]"
            git push origin HEAD:main
          fi
      - name: Confirm delivery
        shell: bash
        env:
          CONFIRM_SECRET: ${{ secrets.EIRDAN_DIAGNOSTICS_CONFIRM_SECRET }}
        run: |
          set -euo pipefail
          RUN_ID="$(jq -r '.run_id' diagnostics/latest.json)"
          curl --fail --silent --show-error --retry 3 -X POST "https://eirdan-diagnostics.arttk800.workers.dev/confirm" \
            -H "Content-Type: application/json" \
            -H "X-Eirdan-Confirm: $CONFIRM_SECRET" \
            --data "$(jq -nc --arg run_id "$RUN_ID" --arg sha "$GITHUB_SHA" '{run_id:$run_id,github_sha:$sha}')"
