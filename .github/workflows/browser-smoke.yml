# CAMPAIGN BROWSER GATE
# Runs only when the finished change block is promoted to the ci/gate branch.
name: Browser smoke
on:
  workflow_dispatch:
  push:
    branches:
      - ci/gate
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
