<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#100c09"><title>Эйрдан — редактор персонажа</title><style>
:root{--bg:#100c09;--panel:#1b1512;--panel2:#15100e;--line:#49382e;--text:#eee5dc;--muted:#a99b90;--gold:#c48752;--gold2:#80502f;--bad:#c66f63;--good:#84a978}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#2a1a11 0,transparent 31%),var(--bg);color:var(--text);font-family:system-ui,sans-serif;padding-bottom:86px}button,input,select{font:inherit;color:inherit}button{cursor:pointer}header{position:sticky;top:0;z-index:5;background:#100c09ed;border-bottom:1px solid #30241e;padding:14px 16px 10px}.brand{font:700 27px Georgia,serif;color:var(--gold);letter-spacing:.08em}.sub{color:var(--muted);font-size:13px}.progress{height:3px;background:#2b211c;margin-top:10px}.progress i{display:block;height:100%;background:var(--gold)}.steps{display:flex;gap:7px;overflow:auto;padding-top:10px;scrollbar-width:none}.steps button{white-space:nowrap;border:1px solid #3b2e27;background:var(--panel2);border-radius:999px;padding:8px 11px;color:var(--muted)}.steps button.on{border-color:var(--gold);color:var(--text)}main{max-width:720px;margin:auto;padding:18px 16px}.title{font:700 30px Georgia,serif;margin:4px 0 8px}.lead,.muted{color:var(--muted);line-height:1.45}.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card,.panel{background:var(--panel2);border:1px solid #3b2e27;border-radius:16px;padding:14px}.card{text-align:left}.card.sel{border-color:var(--gold);background:#281a12}.card b{display:block;font-size:17px}.card small{display:block;color:var(--muted);margin-top:5px;line-height:1.35}.panel{background:var(--panel);margin:12px 0}.stat{display:grid;grid-template-columns:minmax(0,1fr) 132px;align-items:center;gap:8px;padding:11px 0;border-bottom:1px solid #332720}.counter{display:grid;grid-template-columns:38px 40px 38px;gap:4px;align-items:center}.counter b{text-align:center}.counter button{height:40px;background:#211712;border:1px solid var(--line);border-radius:10px}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:12px 0}.tabs button{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 3px}.tabs button.on{border-color:var(--gold);background:#281a12}.trait{width:100%;text-align:left;margin:6px 0;background:var(--panel2);border:1px solid var(--line);border-radius:13px;padding:12px}.trait.sel{border-color:var(--gold);background:#281a12}.trait small{display:block;color:var(--muted);margin-top:4px}.field{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:13px}.row{display:flex;justify-content:space-between;gap:15px;padding:10px 0;border-bottom:1px solid #332720}.row span{color:var(--muted);text-align:right}footer{position:fixed;bottom:0;left:0;right:0;background:#151116f2;border-top:1px solid #382d35;padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:flex;gap:10px}footer button{height:52px;flex:1;border:1px solid var(--line);background:#211a16;border-radius:14px}footer .primary{background:var(--gold2);font-weight:700}@media(max-width:480px){.cards{grid-template-columns:1fr 1fr}.title{font-size:28px}}
</style></head><body><header><div class="brand">ЭЙРДАН</div><div class="sub" id="sub"></div><div class="progress"><i id="bar"></i></div><div class="steps" id="steps"></div></header><main id="app"></main><footer><button id="back">Назад</button><button class="primary" id="next">Далее</button></footer><script>
const KEY='eyrdan_creator_v2',names=['Способ','Раса','Внешность','Происхождение','Путь','Характеристики','Черты','Снаряжение','Итог'];
const races={human:'Человек',elf:'Эльф',dwarf:'Дворф',halfelf:'Полуэльф',halfling:'Полурослик',orc:'Орк',half_orc:'Полуорк',gnome:'Гном',tiefling:'Тифлинг',beastkin:'Зверолюд'};
const origins={peasant:'Крестьянская семья',artisan:'Семья ремесленника',minor_noble:'Обедневшая знать',merchant:'Торговый дом',frontier:'Пограничное поселение',hunter:'Лесная окраина',military:'Военная семья',clergy:'При храме',underworld:'Улица и преступная среда',nomad:'Кочевой род',scholar:'Учёная среда',refugee:'Беженцы',sailor:'Портовая семья',orphan:'Сирота'};
const paths={warrior:'Воин',hunter:'Охотник',rogue:'Ловкач',healer:'Лекарь',mage:'Ученик мага',mercenary:'Наёмник',scout:'Разведчик',craftsman:'Ремесленник',scholar:'Учёный',acolyte:'Послушник',bard:'Менестрель',traveler:'Странник',none:'Без специализации'};
const traitData={'Чуткий сон':['positive','Легче просыпается от шума и опасности.'],'Крепкий желудок':['positive','Лучше переносит сомнительную пищу и воду.'],'Хладнокровие':['positive','Лучше сохраняет контроль под давлением.'],'Наблюдательный':['positive','Лучше замечает детали и угрозы.'],'Выносливый':['positive','Медленнее накапливает усталость.'],'Быстро учится':['positive','Быстрее осваивает навыки.'],'Крепкая память':['positive','Лучше запоминает сведения.'],'Общительный':['positive','Проще устанавливает контакт.'],'Осторожный':['positive','Лучше оценивает риск.'],'Тяжёлый сон':['negative','Сложнее проснуться от тихой опасности.'],'Вспыльчивый':['negative','Провокации мешают самоконтролю.'],'Слабый желудок':['negative','Хуже переносит плохую пищу и воду.'],'Хрупкий':['negative','Тяжелее переносит травмы.'],'Тугодум':['negative','Медленнее осваивает сложные знания.'],'Боязнь высоты':['negative','Высота вызывает стресс.'],'Клаустрофобия':['negative','Замкнутые пространства повышают стресс.'],'Забывчивый':['negative','Чаще забывает детали.'],'Нелюдимый':['negative','Сложнее устанавливает доверие.'],'Чувствительный к боли':['negative','Боль сильнее мешает действиям.'],'Ночная сова':['mixed','Бодрее вечером, тяжелее утром.'],'Ранний подъём':['mixed','Бодрее утром, раньше устает вечером.'],'Упрямый':['mixed','Устойчивее к давлению, сложнее менять решение.'],'Азартный':['mixed','Увереннее при риске, сложнее вовремя остановиться.']};
const gear={warrior:'Короткий меч · стёганка · плащ',hunter:'Охотничий лук · нож · 12 стрел',healer:'Сумка лекаря · нож · бинты',mage:'Посох · нож · письменные принадлежности',traveler:'Посох · нож · плащ · фляга',rogue:'Нож · тёмный плащ · верёвка'};
function fresh(){return {mode:'manual',visibilityMode:localStorage.getItem('eyrdan_visibility')||'hybrid',race:'human',sex:'Мужчина',height:'Средний',build:'Обычное',hair:'Тёмные',eyes:'Карие',origin:'peasant',path:'none',stats:{Сила:8,Ловкость:8,Выносливость:8,Разум:8,Воля:8,Восприятие:8},traits:[],gear:'traveler',name:'',age:24}}
let d=(()=>{try{return Object.assign(fresh(),JSON.parse(localStorage.getItem(KEY))||{})}catch{return fresh()}})(),step=0,traitTab='positive';const app=document.querySelector('#app'),pick=a=>a[Math.floor(Math.random()*a.length)],save=()=>localStorage.setItem(KEY,JSON.stringify(d));
function shell(t,l,b){return '<h1 class="title">'+t+'</h1><p class="lead">'+l+'</p>'+b}function cards(o,k){return '<div class="cards">'+Object.entries(o).map(([id,n])=>'<button class="card '+(d[k]===id?'sel':'')+'" data-set="'+k+'" data-val="'+id+'"><b>'+n+'</b></button>').join('')+'</div>'}
function cost(v){return ({8:0,9:1,10:2,11:3,12:4,13:5,14:7,15:9})[v]||0}function used(){return Object.values(d.stats).reduce((a,v)=>a+cost(v),0)}function type(t){return traitData[t][0]}function count(t){return d.traits.filter(x=>type(x)===t).length}function reqNeg(){let p=count('positive');return p<=1?0:p<=3?1:3}
function randomAll(){d.race=pick(Object.keys(races));d.origin=pick(Object.keys(origins));d.path=pick(Object.keys(paths));d.height=pick(['Низкий','Средний','Высокий']);d.build=pick(['Худощавое','Обычное','Крепкое','Массивное']);d.hair=pick(['Светлые','Русые','Тёмные','Рыжие']);d.eyes=pick(['Карие','Серые','Зелёные','Голубые']);d.stats={Сила:13,Ловкость:12,Выносливость:13,Разум:10,Воля:10,Восприятие:12};d.traits=[];let p=pick(Object.keys(traitData).filter(x=>type(x)==='positive')),n=pick(Object.keys(traitData).filter(x=>type(x)==='negative'));d.traits=[p,n];d.gear=gear[d.path]?d.path:'traveler';d.name=pick(['Альрик','Бран','Элина','Мара','Теод','Ровена']);d.age=18+Math.floor(Math.random()*30);save()}
function view(){let body='';
if(step===0)body=shell('Как создать героя?','Выбери способ. Любой этап можно открыть сверху в любой момент.', '<div class="cards">'+[['manual','Вручную','Полный контроль.'],['quiz','По опросу','Подбор основы по ответам.'],['description','По описанию','Подготовлено для будущего ИИ.'],['random','Полный рандом','Сразу заполнить героя.'],['destiny','Неизвестная судьба','Будущий режим развития с детства.']].map(x=>'<button class="card '+(d.mode===x[0]?'sel':'')+'" data-mode="'+x[0]+'"><b>'+x[1]+'</b><small>'+x[2]+'</small></button>').join('')+'</div>');
if(step===1)body=shell('Раса','Народ героя и его происхождение.',cards(races,'race'));
if(step===2)body=shell('Внешность','Базовая внешность героя.','<div class="panel">'+[['height','Рост',['Низкий','Средний','Высокий']],['build','Телосложение',['Худощавое','Обычное','Крепкое','Массивное']],['hair','Волосы',['Светлые','Русые','Тёмные','Рыжие']],['eyes','Глаза',['Карие','Серые','Зелёные','Голубые']]].map(x=>'<p>'+x[1]+'</p><select class="field" data-select="'+x[0]+'">'+x[2].map(v=>'<option '+(d[x[0]]===v?'selected':'')+'>'+v+'</option>').join('')+'</select>').join('')+'</div>');
if(step===3)body=shell('Происхождение','Среда, в которой вырос герой.',cards(origins,'origin'));
if(step===4)body=shell('Стартовый путь','Подготовка, а не жесткий класс.',cards(paths,'path'));
if(step===5)body=shell('Характеристики','Point Buy: 27 очков, значения 8–15.','<div class="panel"><b>Свободно: '+(27-used())+'/27</b>'+Object.entries(d.stats).map(([k,v])=>'<div class="stat"><div><b>'+k+'</b></div><div class="counter"><button data-stat="'+k+'" data-d="-1">−</button><b>'+v+'</b><button data-stat="'+k+'" data-d="1">+</button></div></div>').join('')+'</div>');
if(step===6){let labels={positive:'Положительные',negative:'Негативные',mixed:'Смешанные'},list=Object.keys(traitData).filter(x=>type(x)===traitTab);body=shell('Черты','Положительные требуют компенсации недостатками; смешанные несут и плюс, и минус.','<div class="panel">Положительные '+count('positive')+'/5 · Негативные '+count('negative')+' (нужно '+reqNeg()+') · Смешанные '+count('mixed')+'/3</div><div class="tabs">'+Object.keys(labels).map(x=>'<button class="'+(traitTab===x?'on':'')+'" data-tab="'+x+'">'+labels[x]+'</button>').join('')+'</div>'+list.map(t=>'<button class="trait '+(d.traits.includes(t)?'sel':'')+'" data-trait="'+t+'"><b>'+t+'</b><small>'+traitData[t][1]+'</small></button>').join(''))}
if(step===7)body=shell('Стартовое имущество','Выбери стартовый комплект.',cards(gear,'gear'));
if(step===8)body=shell('Итог','Проверь героя и сохрани его в основной интерфейс.','<div class="panel"><label>Имя</label><input id="heroNameInput" class="field" value="'+d.name+'"><p>Возраст</p><input id="heroAgeInput" class="field" type="number" min="14" max="700" value="'+d.age+'"></div><div class="panel">'+[['Раса',races[d.race]],['Происхождение',origins[d.origin]],['Путь',paths[d.path]],['Черты',d.traits.join(', ')||'нет'],['Снаряжение',gear[d.gear]||gear.traveler]].map(x=>'<div class="row"><b>'+x[0]+'</b><span>'+x[1]+'</span></div>').join('')+'</div>');
app.innerHTML=body;document.querySelector('#sub').textContent='Создание персонажа · '+(step+1)+'/9';document.querySelector('#bar').style.width=((step+1)/9*100)+'%';document.querySelector('#steps').innerHTML=names.map((n,i)=>'<button class="'+(i===step?'on':'')+'" data-step="'+i+'">'+(i+1)+'. '+n+'</button>').join('');document.querySelector('#next').textContent=step===8?'Сохранить персонажа':'Далее';bind()}
function bind(){document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{step=+b.dataset.step;view();scrollTo(0,0)});document.querySelectorAll('[data-set]').forEach(b=>b.onclick=()=>{d[b.dataset.set]=b.dataset.val;save();view()});document.querySelectorAll('[data-select]').forEach(x=>x.onchange=()=>{d[x.dataset.select]=x.value;save()});document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{d.mode=b.dataset.mode;if(d.mode==='random'){randomAll();step=8}else if(d.mode==='quiz'){d.origin='frontier';d.path='scout';d.stats={Сила:10,Ловкость:13,Выносливость:12,Разум:10,Воля:11,Восприятие:14};d.traits=['Наблюдательный','Осторожный','Тяжёлый сон'];step=1}save();view()});document.querySelectorAll('[data-stat]').forEach(b=>b.onclick=()=>{let k=b.dataset.stat,n=d.stats[k]+Number(b.dataset.d);if(n<8||n>15)return;let nu=used()-cost(d.stats[k])+cost(n);if(nu>27)return;d.stats[k]=n;save();view()});document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{traitTab=b.dataset.tab;view()});document.querySelectorAll('[data-trait]').forEach(b=>b.onclick=()=>{let t=b.dataset.trait,i=d.traits.indexOf(t),ty=type(t);if(i>=0)d.traits.splice(i,1);else{if(ty==='positive'&&count('positive')>=5)return;if(ty==='mixed'&&count('mixed')>=3)return;d.traits.push(t)}save();view()});let n=document.querySelector('#heroNameInput');if(n)n.oninput=()=>{d.name=n.value;save()};let a=document.querySelector('#heroAgeInput');if(a)a.oninput=()=>{d.age=+a.value;save()}}
document.querySelector('#back').onclick=()=>{if(step>0){step--;view();scrollTo(0,0)}else history.back()};document.querySelector('#next').onclick=()=>{if(step===6&&count('negative')<reqNeg()){alert('Добавь негативные черты для баланса.');return}if(step<8){step++;view();scrollTo(0,0)}else{save();location.href='./index.html'}};view();
</script></body></html>
